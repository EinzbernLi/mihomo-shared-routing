# Merge this fragment into a subscription as a high-priority override.
# Do not import it as a standalone subscription: it contains no proxy nodes.
rule-providers:
  shared_ms_store:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/shared_ms_store.yaml
    url: https://raw.githubusercontent.com/EinzbernLi/mihomo-shared-routing/main/rules/microsoft-store.yaml
  shared_cn_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./ruleset/shared_cn_domain.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
  shared_cn_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: ./ruleset/shared_cn_ip.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
  shared_ads:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./ruleset/shared_ads.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs

rules:
  - RULE-SET,shared_ms_store,DIRECT
  - RULE-SET,shared_ads,REJECT
  - RULE-SET,shared_cn_domain,DIRECT
  - RULE-SET,shared_cn_ip,DIRECT,no-resolve
